global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local-minikube
scrape_configs:
- job_name: tablesync-applications
  kubernetes_sd_configs:
  - role: endpoints
    namespaces:
      names:
      - tablesync
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_service_name
    regex: api-gateway|session|order|payment
    action: keep
  - source_labels:
    - __meta_kubernetes_endpoint_port_name
    regex: http
    action: keep
  - source_labels:
    - __meta_kubernetes_service_name
    target_label: service
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - &id001
    target_label: environment
    replacement: local-minikube
- job_name: kube-state-metrics
  kubernetes_sd_configs:
  - role: endpoints
    namespaces:
      names:
      - tablesync
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_service_name
    regex: kube-state-metrics
    action: keep
  - source_labels:
    - __meta_kubernetes_endpoint_port_name
    regex: http
    action: keep
  - source_labels:
    - __meta_kubernetes_service_name
    target_label: service
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - *id001
- job_name: rabbitmq
  kubernetes_sd_configs:
  - role: endpoints
    namespaces:
      names:
      - tablesync
  relabel_configs:
  - source_labels:
    - __meta_kubernetes_service_name
    regex: rabbitmq
    action: keep
  - source_labels:
    - __meta_kubernetes_endpoint_port_name
    regex: metrics
    action: keep
  - source_labels:
    - __meta_kubernetes_service_name
    target_label: service
  - source_labels:
    - __meta_kubernetes_pod_name
    target_label: pod
  - *id001
- job_name: kubelet-cadvisor
  scheme: https
  authorization:
    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
  tls_config:
    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    server_name: kubernetes.default.svc
  kubernetes_sd_configs:
  - role: node
  relabel_configs:
  - target_label: __address__
    replacement: kubernetes.default.svc:443
  - source_labels:
    - __meta_kubernetes_node_name
    target_label: __metrics_path__
    replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
  - *id001
