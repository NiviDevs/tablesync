apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-dev
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
      - name: migrate
        image: tablesync/session:dev
        command:
        - node
        - infra/postgres/migrate.mjs
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: tablesync-secrets
              key: DATABASE_URL
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
