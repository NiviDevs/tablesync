apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: api-gateway
        image: tablesync/api-gateway:dev
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - configMapRef:
            name: tablesync-config
        env:
        - name: INTERNAL_API_SECRET
          valueFrom:
            secretKeyRef:
              name: tablesync-secrets
              key: INTERNAL_API_SECRET
        - name: GUEST_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              name: tablesync-secrets
              key: GUEST_TOKEN_SECRET
        - name: STAFF_JWT_ISSUER
          valueFrom:
            secretKeyRef:
              name: tablesync-secrets
              key: STAFF_JWT_ISSUER
        - name: STAFF_JWT_AUDIENCE
          valueFrom:
            secretKeyRef:
              name: tablesync-secrets
              key: STAFF_JWT_AUDIENCE
        - name: STAFF_JWKS_URL
          valueFrom:
            secretKeyRef:
              name: tablesync-secrets
              key: STAFF_JWKS_URL
        - name: STAFF_ASSIGNMENTS_JSON
          valueFrom:
            secretKeyRef:
              name: tablesync-secrets
              key: STAFF_ASSIGNMENTS_JSON
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /livez
            port: http
          timeoutSeconds: 2
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /livez
            port: http
          timeoutSeconds: 2
          periodSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          timeoutSeconds: 2
          periodSeconds: 5
          failureThreshold: 3
---
