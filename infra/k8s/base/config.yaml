apiVersion: v1
kind: ConfigMap
metadata:
  name: tablesync-config
data:
  TABLESYNC_RUNTIME: services
  SESSION_SERVICE_URL: http://session:8081
  ORDER_SERVICE_URL: http://order:8082
  PAYMENT_SERVICE_URL: http://payment:8083
  REDIS_URL: redis://redis:6379
  GATEWAY_URL: http://api-gateway:8080
  PROMETHEUS_URL: http://prometheus:9090
  GRAFANA_URL: http://localhost:3001/d/tablesync-application
  TABLESYNC_DEMO_ENABLED: 'true'
  TABLESYNC_DEMO_IDENTITY_URL: http://demo-identity:8084
  OPS_ENVIRONMENT: local-minikube
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-plugins
data:
  enabled_plugins: '[rabbitmq_management,rabbitmq_prometheus].'
