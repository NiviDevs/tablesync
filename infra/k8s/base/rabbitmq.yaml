apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
  - name: amqp
    port: 5672
    targetPort: 5672
  - name: metrics
    port: 15692
    targetPort: 15692
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13.7-management-alpine
        ports:
        - containerPort: 5672
          name: amqp
        - containerPort: 15692
          name: metrics
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: RABBITMQ_DEFAULT_USER
          value: tablesync
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: tablesync-secrets
              key: RABBITMQ_DEFAULT_PASS
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        - name: plugins
          mountPath: /etc/rabbitmq/enabled_plugins
          subPath: enabled_plugins
        readinessProbe:
          exec: &id001
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          periodSeconds: 10
          timeoutSeconds: 5
        startupProbe:
          exec: *id001
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: plugins
        configMap:
          name: rabbitmq-plugins
  serviceName: rabbitmq
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
