apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
      - name: postgres
        image: postgres:16.4-alpine
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        env:
        - name: POSTGRES_DB
          value: tablesync
        - name: POSTGRES_USER
          value: tablesync
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tablesync-secrets
              key: POSTGRES_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec: &id001
            command:
            - pg_isready
            - -U
            - tablesync
            - -d
            - tablesync
          periodSeconds: 5
        startupProbe:
          exec: *id001
          periodSeconds: 5
          failureThreshold: 30
  serviceName: postgres
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 2Gi
