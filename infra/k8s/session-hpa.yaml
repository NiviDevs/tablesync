apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: session
  namespace: tablesync
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: session}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Pods, value: 1, periodSeconds: 60}
