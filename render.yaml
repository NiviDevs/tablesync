services:
  - type: web
    name: tablesync-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./services/api-gateway/Dockerfile
    dockerContext: ./services/api-gateway
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: TABLESYNC_RUNTIME
        value: local-demo
      - key: WEB_ORIGIN
        value: https://tablesync-weld.vercel.app
