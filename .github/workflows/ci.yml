name: Product checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    # Build-only public placeholders; no identity-provider requests or secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-only.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify runtime
        run: |
          test "$(node --version)" = "v22.23.3"
          test "$(npm --version)" = "10.9.9"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
