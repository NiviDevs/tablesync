name: Product checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    # Build-only public placeholders; no identity-provider requests or secrets.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-only.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-only-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify runtime
        run: |
          test "$(node --version)" = "v22.23.3"
          test "$(npm --version)" = "10.9.9"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  integration:
    needs: checks
    runs-on: ubuntu-latest
    env:
      INTERNAL_API_SECRET: synthetic-ci-internal-credential-32-bytes-minimum
      GUEST_TOKEN_SECRET: synthetic-ci-guest-credential-32-bytes-minimum
      DATABASE_URL: postgresql://tablesync:tablesync@localhost:5432/tablesync
      TEST_DATABASE_URL: postgresql://tablesync:tablesync@localhost:5432/tablesync_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start isolated dependencies
        run: docker compose -p tablesync-ci up -d --wait --wait-timeout 180 postgres redis rabbitmq
      - name: Back up and baseline the synthetic Compose database
        run: |
          docker compose -p tablesync-ci exec -T postgres pg_dump -U tablesync --no-owner --no-acl tablesync > "$RUNNER_TEMP/tablesync-baseline.sql"
          test -s "$RUNNER_TEMP/tablesync-baseline.sql"
          BASELINE_BACKUP_CONFIRMED=yes npm run db:migrate -- --baseline
          docker compose -p tablesync-ci exec -T postgres createdb -U tablesync tablesync_test_ci
      - run: npm run test:integration
      - run: docker compose -p tablesync-ci up -d --build --wait --wait-timeout 180
      - run: npm run smoke:services
      - name: Stop the isolated stack without deleting volumes
        if: always()
        run: docker compose -p tablesync-ci stop
